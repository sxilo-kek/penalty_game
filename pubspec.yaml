name: penalty_game
description: Penalty kick game built with Flame for Flutter Web.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  go_router: ^14.6.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/penalty_game/
    - assets/images/wheel_game/
    - assets/wheel_prizes.json
